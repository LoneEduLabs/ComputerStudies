 ADD BUTTON \"About Us\"","step":"w1-s11"},{"id":"i","type":"input","label":"Command: LINK BUTTON \"Get Started\" TO \"Home\"","note":"This is what makes the button open the Home screen.","step":"w1-s12"},{"id":"j","type":"process","label":"Style the screen: gradient header, navy logo, teal buttons","note":"Exact choices are listed in the guide.","step":"w1-style"},{"id":"k","type":"subprocess","label":"Run Project and tap Get Started","note":"The studio shows a demo, then you tap it yourself.","step":"w1-s14"},{"id":"q","type":"decision","label":"Does Get Started open the Home screen?"},{"id":"fix","type":"process","label":"Check the LINK command and the button name","note":"Fix it, then run again.","rowWith":"q"},{"id":"l","type":"display","label":"Home screen is shown with the module tiles"},{"id":"end","type":"end","label":"Module 1 complete: take the 5-question quiz"}],"edges":[{"from":"start","to":"a"},{"from":"a","to":"b"},{"from":"b","to":"c"},{"from":"c","to":"d"},{"from":"d","to":"e"},{"from":"e","to":"f"},{"from":"f","to":"g"},{"from":"g","to":"h"},{"from":"h","to":"i"},{"from":"i","to":"j"},{"from":"j","to":"k"},{"from":"k","to":"q"},{"from":"q","to":"l","label":"Yes"},{"from":"q","to":"fix","label":"No"},{"from":"fix","to":"k","route":"loop","side":"right"},{"from":"l","to":"end"}]},"apps/school-app-1/modules/01-welcome.json":{"id":"w1","number":1,"title":"Welcome Screen","icon":"star","week":1,"summary":"Design the first screen of your app: your school’s name, a logo, a welcome message, cards and buttons.","skills":["Components","Drag and drop","Properties","Colours","Commands","Navigation","Testing"],"screens":[{"id":"welcome","name":"Welcome"},{"id":"home","name":"Home","builtin":true}],"startScreen":"welcome","tools":["header","logo","text","card","button"],"builtinHome":true,"listCollection":null,"subjectCards":false,"formScreen":null,"steps":[{"id":"w1-s1","title":"Add the school header","screen":"welcome","objective":"Start your welcome screen with a title bar.","concept":"The welcome screen is the first thing students see. A header at the top will carry your school’s name.","expected":"A title bar appears at the top of the phone.","do":{"k":"drag","tool":"header","zone":"header","n":1},"expect":[{"type":"header","zone":"header","min":1,"label":"A Header sits in the Header zone of the Welcome screen","fail":"Drag the Header tool onto the glowing Header zone."}],"hints":["Find the glowing Header tool in the toolbox on the left.","Drag it onto the dashed strip at the top of the phone.","On a touch screen: tap Header, then tap the glowing Header zone."]},{"id":"w1-s2","title":"Type your school’s name","screen":"welcome","objective":"Make the app yours by using your real school name.","concept":"The header text becomes the title of your welcome screen. Everyone who opens the app will see it first.","expected":"The header shows your school’s name.","do":{"k":"edit","type":"header","text":"Alrowad International Schools"},"expect":[{"type":"header","text":"Alrowad International Schools","label":"The header says exactly: Alrowad International Schools","fail":"Select the header on the phone, then in Properties → Text content type exactly: Alrowad International Schools"}],"hints":["Click the header on the phone to select it.","In the Properties panel, change Text content.","Type your school’s name, then press Check My Work."],"styles":[{"target":{"type":"header","text":"Alrowad International Schools"},"set":{"preset":"gradient"},"screen":"welcome"}]},{"id":"w1-s3","title":"Add your school logo","screen":"welcome","objective":"Place a logo badge on the screen.","concept":"A logo is a round badge that shows your school’s initials. It makes the app feel like it belongs to your school.","expected":"A round badge appears in the middle of the phone.","do":{"k":"drag","tool":"logo","zone":"body","n":1},"expect":[{"type":"logo","min":1,"label":"A Logo sits in the Body zone","fail":"Drag the Logo tool into the Body zone."}],"hints":["The Logo tool is in the toolbox, with a pink badge icon.","Drop it in the large Body zone.","Tap-to-place works too: tap Logo, then tap the Body zone."]},{"id":"w1-s4","title":"Put your school name on the logo","screen":"welcome","objective":"Learn that the logo takes its initials from the name you type.","concept":"The logo shows the first letters of the words you type. “Al Rowad School” becomes AR.","expected":"The logo shows your school’s initials and name.","do":{"k":"edit","type":"logo","text":"Alrowad International Schools"},"expect":[{"type":"logo","text":"Alrowad International Schools","label":"The logo says exactly: Alrowad International Schools","fail":"Select the logo on the phone, then in Properties → Text content type exactly: Alrowad International Schools"}],"hints":["Click the logo on the phone.","Edit Text content in the Properties panel.","Type your school’s name. The initials update by themselves."],"styles":[{"target":{"type":"logo","text":"Alrowad International Schools"},"set":{"bg":"#17263D"},"screen":"welcome"}]},{"id":"w1-s5","title":"Write a welcome message","screen":"welcome","objective":"Add a line of text with a command.","concept":"ADD TEXT puts a line of text in the Body zone. Write a friendly message in your own words, inside quotation marks.","expected":"Your message appears under the logo.","do":{"k":"cmd","cmds":["ADD TEXT \"Welcome to our school app!\""],"allow":["ADD TEXT"],"free":false,"select":null},"expect":[{"type":"text","text":"Welcome to our school app!","label":"The message is exactly: Welcome to our school app!"}],"hints":["ADD TEXT adds a line of text.","Put your message inside quotation marks.","For example: ADD TEXT \"Welcome to our school app!\""],"styles":[{"target":{"type":"text","text":"Welcome to our school app!"},"set":{"fg":"#064F47"},"screen":"welcome"}]},{"id":"w1-s6","title":"Add your first card","screen":"welcome","objective":"Use a card to show one feature of your app.","concept":"Cards are blocks that hold one idea each, such as Homework, Timetable or Quiz.","expected":"A card appears in the Body zone.","do":{"k":"drag","tool":"card","zone":"body","n":1},"expect":[{"type":"card","min":1,"label":"A Card sits in the Body zone","fail":"Drag the Card tool into the Body zone."}],"hints":["Find the Card tool.","Drop it in the Body zone.","Tap-to-place: tap Card, then tap the Body zone."]},{"id":"w1-s7","title":"Name your card","screen":"welcome","objective":"Give the card a name with SET TEXT.","concept":"SET TEXT changes the text of the selected component. Choose a feature of your app, such as Homework Helper.","expected":"The card shows your own name for it.","do":{"k":"cmd","cmds":["SET TEXT \"Homework Helper\""],"allow":["SET TEXT"],"free":false,"select":"card"},"expect":[{"type":"card","text":"Homework Helper","label":"The card says exactly: Homework Helper"}],"hints":["Click the card on the phone first.","Then type SET TEXT and the name in quotation marks.","For example: SET TEXT \"Homework Helper\""],"styles":[{"target":{"type":"card","text":"Homework Helper"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"}]},{"id":"w1-s8","title":"Add two more cards","screen":"welcome","objective":"Show three different features with three different cards.","concept":"Each ADD CARD command creates another card. Pick names that tell students what the app can do.","expected":"Three cards, each with its own name.","do":{"k":"cmd","cmds":["ADD CARD \"My Timetable\"","ADD CARD \"Daily Quiz\""],"allow":["ADD CARD"],"free":false,"select":null},"expect":[{"type":"card","min":3,"label":"There are 3 cards: Homework Helper, My Timetable, Daily Quiz"},{"type":"card","text":"Homework Helper","label":"A card says exactly: Homework Helper"},{"type":"card","text":"My Timetable","label":"A card says exactly: My Timetable"},{"type":"card","text":"Daily Quiz","label":"A card says exactly: Daily Quiz"}],"hints":["Type two ADD CARD commands, one per line.","Each name goes in quotation marks.","For example: ADD CARD \"My Timetable\" and ADD CARD \"Daily Quiz\""],"styles":[{"target":{"type":"card","text":"My Timetable"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"},{"target":{"type":"card","text":"Daily Quiz"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"}]},{"id":"w1-s9","title":"Add the Get Started button","screen":"welcome","objective":"Place a button in the Action bar.","concept":"The Get Started button will take students from the welcome screen into the app.","expected":"A button appears at the bottom of the phone.","do":{"k":"drag","tool":"button","zone":"footer","n":1},"expect":[{"type":"button","zone":"footer","min":1,"label":"A Button sits in the Action bar","fail":"Drag the Button tool to the Action bar at the bottom."}],"hints":["Find the Button tool.","Drop it on the Action bar strip at the bottom.","Tap-to-place: tap Button, then tap the Action bar."]},{"id":"w1-s10","title":"Label the button","screen":"welcome","objective":"Give the button a clear label.","concept":"We will use the exact label Get Started, because the next steps find the button by its label.","expected":"The button reads “Get Started”.","do":{"k":"edit","type":"button","text":"Get Started"},"expect":[{"type":"button","text":"Get Started","label":"The button says Get Started","fail":"Select the button and set Text content to exactly: Get Started"}],"hints":["Click the button on the phone.","Change Text content in the Properties panel.","Type exactly: Get Started"],"styles":[{"target":{"type":"button","text":"Get Started"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF"},"screen":"welcome"}]},{"id":"w1-s11","title":"Add a second button","screen":"welcome","objective":"Use another button for a different job.","concept":"A welcome screen can offer more than one choice, such as About Us or Contact. Choose a label that fits your school.","expected":"A second button appears in the Action bar.","do":{"k":"cmd","cmds":["ADD BUTTON \"About Us\""],"allow":["ADD BUTTON"],"free":false,"select":null},"expect":[{"type":"button","min":2,"label":"There are two buttons"},{"type":"button","text":"About Us","label":"The second button says exactly: About Us"}],"hints":["ADD BUTTON adds a button to the Action bar.","The label goes in quotation marks.","For example: ADD BUTTON \"About Us\""],"styles":[{"target":{"type":"button","text":"About Us"},"set":{"preset":"outline"},"screen":"welcome"}]},{"id":"w1-s12","title":"Link Get Started to Home","screen":"welcome","objective":"Make the button open another screen.","concept":"LINK BUTTON sends the user to a screen when they tap. The Home screen is the dashboard of your finished app, which the studio builds for you.","expected":"Get Started now opens Home.","do":{"k":"cmd","cmds":["LINK BUTTON \"Get Started\" TO \"Home\""],"allow":["LINK BUTTON"],"free":false,"select":null},"expect":[{"type":"button","text":"Get Started","link":"home","label":"Get Started is linked to Home","fail":"Run: LINK BUTTON \"Get Started\" TO \"Home\""}],"hints":["LINK BUTTON needs the button label and the screen name.","Both go in quotation marks, with the word TO between.","Exactly: LINK BUTTON \"Get Started\" TO \"Home\""]},{"id":"w1-style","title":"Final style check: every colour, border, shadow and style","screen":"welcome","objective":"Give your screens the same colours, shapes and shadows as the model app.","concept":"Colours were chosen while you built each element. Now finish the whole look: every colour, background, border, corner, shadow and text style below must match the model app you tried at the start. Items you already set show a tick.","expected":"Your screens look exactly like the model app.","hints":["Click the element on the phone first. The style box (Choose colours, borders and corners) opens by itself.","Follow the sub-steps one by one: each says which row to use and which option to click. The red dot shows where.","Text alignment and weight are in the Properties panel (right) under “Text and layout”."],"do":{"k":"style","acts":[{"target":{"type":"header","text":"Alrowad International Schools"},"set":{"preset":"gradient","sh":"medium"},"screen":"welcome"},{"target":{"type":"logo","text":"Alrowad International Schools"},"set":{"bg":"#17263D"},"screen":"welcome"},{"target":{"type":"text","text":"Welcome to our school app!"},"set":{"fg":"#064F47","al":"center","fw":"bold"},"screen":"welcome"},{"target":{"type":"card","text":"Homework Helper"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"},{"target":{"type":"card","text":"My Timetable"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"},{"target":{"type":"card","text":"Daily Quiz"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"},{"target":{"type":"button","text":"Get Started"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF","br":28},"screen":"welcome"},{"target":{"type":"button","text":"About Us"},"set":{"preset":"outline","br":28},"screen":"welcome"}]},"expect":[]},{"id":"w1-s14","title":"Run and test your welcome screen","screen":"welcome","objective":"Use your screen like a student would.","concept":"Run Project turns the phone into a working app. The studio first shows a short demo of your buttons, then you can tap them yourself.","expected":"Tapping Get Started opens the Home dashboard.","do":{"k":"custom","allow":[]},"expect":[{"t":"flag","name":"ran","fail":"Press Run Project in the top bar.","label":"You pressed Run Project"},{"t":"flag","name":"nav:home","label":"You tapped Get Started and saw the Home screen","fail":"In the running app, tap Get Started yourself. If nothing happens, check the link you made in step 12."}],"subs":[{"t":"Press Run Project in the top bar","hot":["topRun"],"done":{"any":[{"run":true},{"flag":"nav:home"}]}},{"t":"Watch the demo, then tap Get Started yourself","hot":["runBtn:Get Started"],"done":{"flag":"nav:home"}}],"hints":["Press Run Project and watch the demo.","Tap the Get Started button on the phone.","The Home dashboard should appear."]}],"objectives":["Design the first screen students see: your school’s name, a logo and a welcome message.","Use cards and buttons, and link a button to the Home screen.","Choose your own colours, then run the screen like a real student."],"mcqs":[{"q":"What is the main job of the first screen of an app?","a":["Welcome the user and show where to go next","Store all the data","Show every feature at once","Run the quiz"],"why":"The first screen gives a friendly start and a clear next action."},{"q":"Which tool puts a round badge with the school's initials on a screen?","a":["Logo","Header","Text Input","Time"],"why":"A logo helps users recognise the school or app at a glance."},{"q":"Why are cards used for the main sections on a welcome screen?","a":["Each card holds one item and is easy to see and tap","Cards make the app load faster","Cards are the only way to add text","Cards hide the buttons"],"why":"Cards group one idea each, so the screen stays tidy."},{"q":"What does a command like LINK BUTTON do?","a":["Connects a button to the screen it should open","Changes the button colour","Deletes the screen","Saves the form"],"why":"Commands are typed instructions that tell the app what to do."},{"q":"What is the best way to check that a button works?","a":["Run the project and tap it like a real user","Look at it carefully","Change its colour","Rename the screen"],"why":"Only running the app shows what a user will really experience."}],"flowchart":"flowcharts/w1.json","reference":{"screens":{"welcome":[{"id":"header-1","type":"header","zone":"header","text":"Alrowad International Schools","action":null,"link":null,"preset":"gradient","sh":"medium"},{"id":"logo-2","type":"logo","zone":"body","text":"Alrowad International Schools","action":null,"link":null,"bg":"#17263D"},{"id":"text-3","type":"text","zone":"body","text":"Welcome to our school app!","action":null,"link":null,"fg":"#064F47","al":"center","fw":"bold"},{"id":"card-4","type":"card","zone":"body","text":"Homework Helper","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"},{"id":"card-5","type":"card","zone":"body","text":"My Timetable","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"},{"id":"card-6","type":"card","zone":"body","text":"Daily Quiz","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"},{"id":"button-7","type":"button","zone":"footer","text":"Get Started","action":null,"link":"home","bg":"#0D8B7D","fg":"#FFFFFF","br":28},{"id":"button-8","type":"button","zone":"footer","text":"About Us","action":null,"link":null,"preset":"outline","br":28}],"home":[]}}},"apps/school-app-1/modules/02-my-homework.json":{"id":"m1","number":2,"title":"My Homework","icon":"book","week":1,"summary":"Build a homework tracker with subject cards, an Add Homework form and a saved list.","skills":["Components","Drag and drop","Properties","Commands","Navigation","Actions","Testing"],"screens":[{"id":"homework","name":"My Homework"},{"id":"form","name":"Add Homework"},{"id":"list","name":"Homework List"}],"startScreen":"homework","tools":["header","card","text","input","button","list"],"formScreen":"form","listCollection":"homework","subjectCards":true,"builtinHome":false,"steps":[{"id":"m1-s1","title":"Add the app header","screen":"homework","objective":"Learn what a header is and how to drag a component onto the phone.","concept":"A header is the title bar at the top of an app screen. It tells people where they are, like the title on a book cover.","expected":"A navy title bar appears at the top of the phone.","do":{"k":"drag","tool":"header","zone":"header","n":1},"expect":[{"type":"header","zone":"header","min":1,"label":"A Header sits in the Header zone of My Homework","fail":"There is no header on the My Homework screen yet. Drag the Header tool onto the glowing Header zone."}],"hints":["Open the Component Toolbox in the left sidebar. One tool glows gold: Header.","Press and hold the Header tool, then drag it onto the glowing dashed strip at the top of the phone.","Using touch? Tap the Header tool, then tap the glowing Header zone. When the header appears, press Check My Work."]},{"id":"m1-s2","title":"Name your screen","screen":"homework","objective":"Learn that every component has properties you can edit.","concept":"Properties are the settings of a component, such as its text. The studio looks after colours and sizes, so you only edit the text.","expected":"The header on the phone reads “My Homework”.","do":{"k":"edit","type":"header","text":"My Homework"},"expect":[{"type":"header","text":"My Homework","label":"The header text is exactly My Homework"}],"hints":["Click the header on the phone. Its properties appear in the panel on the right.","Find the box labelled Text content in the Properties panel and replace what is inside.","Type exactly: My Homework — capital M, capital H and a space. Then press Check My Work."],"styles":[{"target":{"type":"header","text":"My Homework"},"set":{"preset":"gradient"},"screen":"homework"}]},{"id":"m1-s3","title":"Add a subject card","screen":"homework","objective":"Practise dropping a component into the correct zone.","concept":"A card is a block that holds one item. We will use one card for each school subject.","expected":"A card called “New subject” appears in the body.","do":{"k":"drag","tool":"card","zone":"body","n":1},"expect":[{"type":"card","min":1,"label":"A Card sits in the Body zone of My Homework","fail":"No card yet. Drag the Card tool into the glowing Body zone."}],"hints":["The tool you need is Card. It glows gold in the toolbox.","This time the destination is the Body zone: the big open area in the middle of the phone.","Tap-to-place works too: tap Card, then tap the glowing Body zone."]},{"id":"m1-s4","title":"Name the subject with a command","screen":"homework","objective":"Learn to select a component and change it with a command.","concept":"Commands are short instructions you type. SET TEXT changes the text of whatever you have selected. Text always goes inside quotation marks.","expected":"The card says Mathematics and the studio gives it a calculator icon.","do":{"k":"cmd","cmds":["SET TEXT \"Mathematics\""],"allow":["SET TEXT"],"free":false,"select":"card"},"expect":[{"type":"card","text":"Mathematics","label":"The card text is exactly Mathematics"}],"hints":["Commands work on whatever is selected, so click the card on the phone first.","Open the Commands tab in the right panel, click the box and type the command from the step card.","Straight quotation marks go around the text, and Mathematics starts with a capital M. Then press Run Commands."],"styles":[{"target":{"type":"card","text":"Mathematics"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"homework"}]},{"id":"m1-s5","title":"Add another subject","screen":"homework","objective":"Learn that ADD commands create components in the right zone automatically.","concept":"You can build faster by typing. ADD CARD creates a new card and puts it in the Body zone for you.","expected":"A second card called Science appears under Mathematics.","do":{"k":"cmd","cmds":["ADD CARD \"Science\""],"allow":["ADD CARD"],"free":false,"select":null},"expect":[{"type":"card","text":"Science","label":"A card called Science exists","fail":"No card called Science yet. Check the quotation marks and the spelling of the command."}],"hints":["ADD CARD makes a new card without any dragging.","Type ADD CARD and then the subject name inside quotation marks.","Exactly: ADD CARD \"Science\" — then press Run Commands."],"styles":[{"target":{"type":"card","text":"Science"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"homework"}]},{"id":"m1-s6","title":"Add an action button","screen":"homework","objective":"Learn where buttons live and why.","concept":"Buttons let people do things. They sit in the Action bar at the bottom of the screen, where thumbs can reach them.","expected":"A gold button appears at the bottom of the phone.","do":{"k":"drag","tool":"button","zone":"footer","n":1},"expect":[{"type":"button","zone":"footer","min":1,"label":"A Button sits in the Action bar of My Homework","fail":"No button in the Action bar yet. Drag the Button tool to the strip at the bottom of the phone."}],"hints":["Find the glowing Button tool in the toolbox.","Drop it on the glowing strip at the bottom of the phone: the Action bar.","Tap-to-place: tap Button, then tap the Action bar."]},{"id":"m1-s7","title":"Label the button","screen":"homework","objective":"Use the Properties panel again to give a component a clear label.","concept":"A good button label says exactly what will happen when you tap it.","expected":"The button reads “Add Homework” and the studio picks a plus icon.","do":{"k":"edit","type":"button","text":"Add Homework"},"expect":[{"type":"button","text":"Add Homework","label":"The button text is exactly Add Homework"}],"hints":["Click the button on the phone to select it.","Change Text content in the Properties panel.","Type exactly: Add Homework"],"styles":[{"target":{"type":"button","text":"Add Homework"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF"},"screen":"homework"}]},{"id":"m1-s8","title":"Move to a new screen","screen":"homework","objective":"Learn that an app is made of several screens and how to move between them.","concept":"Every app has more than one screen. NAVIGATE TO moves the workspace to another screen so you can build it. The names above the phone are the screen names.","expected":"The phone switches to the Add Homework screen, which is still empty.","do":{"k":"cmd","cmds":["NAVIGATE TO \"Add Homework\""],"allow":["NAVIGATE TO"],"free":false,"select":null},"expect":[{"t":"screen","is":"form","label":"You are now on the Add Homework screen","fail":"You are still on a different screen. Run the NAVIGATE TO command."}],"hints":["NAVIGATE TO changes which screen you are working on.","The screen name goes in quotation marks and must match the tab names above the phone.","Exactly: NAVIGATE TO \"Add Homework\""]},{"id":"m1-s9","title":"Add a text box","screen":"form","objective":"Place an input component on a form.","concept":"A text input is a box where people type. On this screen it will collect the title of a homework task.","expected":"A text box appears in the middle of the phone.","do":{"k":"drag","tool":"input","zone":"body","n":1},"expect":[{"type":"input","min":1,"label":"A Text Input sits in the Body zone of Add Homework","fail":"No text box yet. Drag the Text Input tool into the Body zone."}],"hints":["You should be on the Add Homework screen. Look for the Text Input tool.","Drop it in the glowing Body zone.","Tap-to-place works too: tap Text Input, then tap the Body zone."]},{"id":"m1-s10","title":"Write the hint inside the box","screen":"form","objective":"Learn that an input’s text is the hint people see before they type.","concept":"A hint inside a box tells people what to type. It disappears once they start typing.","expected":"The box shows “Homework title”.","do":{"k":"edit","type":"input","text":"Homework title"},"expect":[{"type":"input","text":"Homework title","label":"The text box hint is exactly Homework title"}],"hints":["Click the text box on the phone to select it.","Edit Text content in the Properties panel.","Type exactly: Homework title"]},{"id":"m1-s11","title":"Add a Save button","screen":"form","objective":"Create a button with a command instead of dragging.","concept":"ADD BUTTON creates a button in the Action bar. The label you type becomes its text.","expected":"A Save button appears in the Action bar of the form.","do":{"k":"cmd","cmds":["ADD BUTTON \"Save\""],"allow":["ADD BUTTON"],"free":false,"select":null},"expect":[{"type":"button","text":"Save","zone":"footer","label":"A button called Save is in the Action bar of Add Homework","fail":"No Save button on the Add Homework screen yet."}],"hints":["Make sure you are on the Add Homework screen.","ADD BUTTON followed by the label in quotation marks.","Exactly: ADD BUTTON \"Save\""],"styles":[{"target":{"type":"button","text":"Save"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF"},"screen":"form"}]},{"id":"m1-s12","title":"Make Save do something","screen":"form","objective":"Learn that an action tells a button what to do.","concept":"Without an action a button does nothing. SAVE HOMEWORK reads the text box on the same screen and stores the text in the browser’s memory (LocalStorage).","expected":"The Save button’s linked action shows SAVE HOMEWORK in the Properties panel.","do":{"k":"cmd","cmds":["SET ACTION \"Save\" SAVE HOMEWORK"],"allow":["SET ACTION"],"free":false,"select":null},"expect":[{"type":"button","text":"Save","action":"SAVE_HOMEWORK","label":"The Save button has the action SAVE HOMEWORK","fail":"The Save button has no SAVE HOMEWORK action yet."}],"hints":["SET ACTION needs the button label in quotes, then the action name.","The action for this button is SAVE HOMEWORK (two words, no quotes).","Exactly: SET ACTION \"Save\" SAVE HOMEWORK"]},{"id":"m1-s13","title":"Link Save to the list","screen":"form","objective":"Connect two screens with a link.","concept":"A link sends people to another screen after the button’s action finishes. First Save stores the homework, then the app opens the list.","expected":"The Save button’s linked action now also says: then go to Homework List.","do":{"k":"cmd","cmds":["LINK BUTTON \"Save\" TO \"Homework List\""],"allow":["LINK BUTTON"],"free":false,"select":null},"expect":[{"type":"button","text":"Save","link":"list","label":"The Save button is linked to Homework List","fail":"The Save button is not linked to the Homework List screen yet."}],"hints":["LINK BUTTON has two pieces of text: the button and the screen.","Both names go in quotation marks, with the word TO between them.","Exactly: LINK BUTTON \"Save\" TO \"Homework List\""]},{"id":"m1-s14","title":"Title the list screen","screen":"list","objective":"Use ADD HEADER on a different screen.","concept":"Every screen needs a header. The command adds it to the Header zone of the screen you are on.","expected":"A “Homework List” header appears at the top of the list screen.","do":{"k":"cmd","cmds":["ADD HEADER \"Homework List\""],"allow":["ADD HEADER"],"free":false,"select":null},"expect":[{"type":"header","text":"Homework List","label":"The Homework List screen has a header called Homework List","fail":"The Homework List screen needs a header with exactly that name."}],"hints":["Check the tab above the phone: you should be on Homework List.","ADD HEADER and the title in quotation marks.","Exactly: ADD HEADER \"Homework List\""],"styles":[{"target":{"type":"header","text":"Homework List"},"set":{"preset":"gradient"},"screen":"list"}]},{"id":"m1-s15","title":"Show saved homework","screen":"list","objective":"Place a component that fills itself with saved data.","concept":"The Homework List component reads the saved homework and shows it. You do not have to update it by hand.","expected":"A list panel appears in the body of the list screen.","do":{"k":"drag","tool":"list","zone":"body","n":1},"expect":[{"type":"list","min":1,"label":"A Homework List sits in the Body zone of Homework List","fail":"No list component on the Homework List screen yet."}],"hints":["Find the Homework List tool in the toolbox.","Drop it in the glowing Body zone.","Tap-to-place: tap Homework List, then tap the Body zone."]},{"id":"m1-s16","title":"Open the form from the first screen","screen":"list","objective":"Finish the wiring so the whole app is connected.","concept":"OPEN FORM tells a button to open the Add Homework screen. The Add Homework button lives on My Homework, so you must go there first. Commands only find components on the screen you are on.","expected":"The Add Homework button is linked: tapping it will open the form.","do":{"k":"cmd","cmds":["NAVIGATE TO \"My Homework\"","SET ACTION \"Add Homework\" OPEN FORM"],"allow":["NAVIGATE TO","SET ACTION"],"free":false,"select":null},"expect":[{"type":"button","text":"Add Homework","action":"OPEN_FORM","screen":"homework","label":"The Add Homework button has the action OPEN FORM","fail":"The Add Homework button on My Homework has no OPEN FORM action yet. If the console says it can’t find the button, check which screen you are on."}],"hints":["Read the console message if a command fails. It tells you which screen you are on.","First go to My Homework, then set the action. You can type both commands on separate lines.","Line 1: NAVIGATE TO \"My Homework\"   Line 2: SET ACTION \"Add Homework\" OPEN FORM"]},{"id":"m1-s17","title":"Debug a command","screen":"homework","objective":"Learn to read an error message and fix the mistake.","concept":"Bugs are normal, even for professionals. When a command fails, the Console explains what went wrong. Here you will make a mistake on purpose, read the message, then fix it.","expected":"The first command fails with a red error about quotation marks. The second one adds a Physics card.","do":{"k":"custom","allow":["ADD CARD"]},"expect":[{"t":"named","name":"quotesSeen","verb":"ADD CARD","label":"You ran a command with a mistake","fail":"Run the first command exactly as shown, without quotation marks, so you can see the error."},{"t":"flag","name":"consoleViewed","label":"You opened the Console tab to read the error","fail":"Open the Console tab in the right panel and read the red message."},{"t":"named","name":"quotesFixed","verb":"ADD CARD","text":"Physics","label":"You fixed it: the Physics card was added","fail":"After the error, run the corrected command: ADD CARD \"Physics\""}],"subs":[{"t":"Type this broken command on purpose:","code":["ADD CARD Physics"],"tab":"commands","panel":"right","hot":["cmd"],"done":{"any":[{"named":"quotesSeen","verb":"ADD CARD"},{"cmdEq":"ADD CARD Physics"}]}},{"t":"Press Run Commands","tab":"commands","panel":"right","hot":["run"],"done":{"named":"quotesSeen","verb":"ADD CARD"}},{"t":"Read the red error in the Console","tab":"console","panel":"right","hot":["tab:console"],"ack":true,"done":{"ack":true}},{"t":"Type the fixed command:","code":["ADD CARD \"Physics\""],"tab":"commands","panel":"right","hot":["cmd"],"done":{"any":[{"cmdEq":"ADD CARD \"Physics\""},{"met":true}]}},{"t":"Press Run Commands","tab":"commands","panel":"right","hot":["run"],"done":{"met":true}}],"hints":["Run ADD CARD Physics first. It is meant to fail.","Open the Console tab. The message tells you what is missing around the text.","Fix it by adding quotation marks: ADD CARD \"Physics\""],"styles":[{"target":{"type":"card","text":"Physics"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"homework"}]},{"id":"m1-s18","title":"Look inside: real HTML","screen":"homework","objective":"See the real HTML code the studio writes for your button.","concept":"HTML is the language of web pages. Every component you place becomes an HTML element, written with a tag such as <header> or <article>. The studio writes this for you as you build.","expected":"You can name the tag that creates your button.","do":{"k":"custom","allow":[]},"expect":[{"t":"flag","name":"htmlTabViewed","label":"You opened the Code tab (HTML/CSS/JavaScript)","fail":"Open the Code tab (HTML/CSS/JavaScript) in the right panel."},{"t":"named","name":"answer","answer":"button","label":"Your answer is correct","fail":"Not quite. Select the Add Homework button on the phone and look at the gold line in the HTML view. The tag is the first word after <."}],"subs":[{"t":"Click the Add Homework button on the phone","hot":["comp:button"],"done":{"any":[{"sel":"button"},{"met":true}]}},{"t":"Find the gold line in the Code tab","tab":"code","panel":"right","hot":["tab:code"],"ack":true,"done":{"ack":true}},{"t":"Type the tag name in the answer box","hot":["quiz"],"done":{"named":"answer","answer":"button"}}],"hints":["Click the Code tab, then click the Add Homework button on the phone.","One line in the HTML view turns gold. It starts with a tag name in blue.","The tag name is a single word: the thing you tap."],"quiz":{"prompt":"Which HTML tag creates the Add Homework button? (type the tag name)","accept":["button"]}},{"id":"m1-style","title":"Final style check: every colour, border, shadow and style","screen":"homework","objective":"Give your screens the same colours, shapes and shadows as the model app.","concept":"Colours were chosen while you built each element. Now finish the whole look: every colour, background, border, corner, shadow and text style below must match the model app you tried at the start. Items you already set show a tick.","expected":"Your screens look exactly like the model app.","hints":["Click the element on the phone first. The style box (Choose colours, borders and corners) opens by itself.","Follow the sub-steps one by one: each says which row to use and which option to click. The red dot shows where.","Text alignment and weight are in the Properties panel (right) under “Text and layout”."],"do":{"k":"style","acts":[{"target":{"type":"header","text":"My Homework"},"set":{"preset":"gradient","sh":"medium"},"screen":"homework"},{"target":{"type":"card","text":"Mathematics"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"homework"},{"target":{"type":"card","text":"Science"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"homework"},{"target":{"type":"button","text":"Add Homework"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF","br":28},"screen":"homework"},{"target":{"type":"card","text":"Physics"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"homework"},{"target":{"type":"button","text":"Save"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF","br":28},"screen":"form"},{"target":{"type":"header","text":"Homework List"},"set":{"preset":"gradient","sh":"medium"},"screen":"list"}]},"expect":[]},{"id":"m1-s19","title":"Run and test your app","screen":"homework","objective":"Test your app like a real user and confirm that saved data appears in the list.","concept":"Testing means using your app the way a user would. Run Project switches the phone from build mode to a working app.","expected":"Your homework title appears on the Homework List screen.","do":{"k":"custom","allow":[]},"expect":[{"t":"flag","name":"ran","label":"You pressed Run Project","fail":"Press Run Project in the top bar to start your app."},{"t":"flag","name":"saved:homework","label":"Homework was saved from the running app","fail":"Tap Add Homework, type a title in the box and tap Save inside the running app. If something fails, read the console: it will tell you what is missing."},{"t":"flag","name":"viewed:list:homework","label":"You saw it on the Homework List screen","fail":"After saving, your app should open the Homework List. If it does not, check the link on the Save button."}],"subs":[{"t":"Press Run Project in the top bar","hot":["topRun"],"done":{"any":[{"run":true},{"flag":"saved:homework"}]}},{"t":"In the phone, tap Add Homework","hot":["runBtn:Add Homework"],"done":{"any":[{"runScreen":"form"},{"flag":"saved:homework"}]}},{"t":"Type a homework title in the box:","code":["Read chapter 3"],"hot":["runInput"],"done":{"any":[{"flag":"saved:homework"},{"runInput":true}]}},{"t":"Tap Save","hot":["runBtn:Save"],"done":{"flag":"saved:homework"}},{"t":"Look at your homework in the list","hot":["runComp:list"],"done":{"flag":"viewed:list:homework"}}],"hints":["Press Run Project. The phone turns into a working app.","Tap Add Homework, type “Read chapter 3”, tap Save.","Nothing happens? Stop the app and check the buttons’ actions in Properties and in Screen Connections in the sidebar."]}],"objectives":["Build a form that saves homework with a title.","Show saved homework in a list that updates by itself.","Connect screens with actions and links, and learn to read an error message."],"mcqs":[{"q":"What is the difference between NAVIGATE TO and LINK BUTTON?","a":["NAVIGATE TO moves the screen you are editing; LINK BUTTON sets where a button takes the user","They are the same command","NAVIGATE TO saves data","LINK BUTTON changes colours"],"why":"One moves your workspace, the other builds a connection for users."},{"q":"Why are the form and the list on separate screens?","a":["Each screen has one clear job","Phones cannot show two things","It makes saving slower","It hides the data"],"why":"Single-purpose screens are easier to understand and test."},{"q":"An error says a quotation mark is missing. What should you do?","a":["Read it, find the mistake, fix it and run again","Ignore it","Restart the studio","Delete the screen"],"why":"Error messages are clues that tell you what to fix."},{"q":"Which HTML tag creates a button?","a":["<button>","<card>","<screen>","<header2>"],"why":"The studio writes real HTML, where buttons use the button tag."},{"q":"Why does an app save data in a collection instead of keeping it on the screen?","a":["So it is still there when the user leaves and comes back","To make the screen larger","To change the header","To hide the data"],"why":"Stored data survives moving between screens."}],"flowchart":"flowcharts/m1.json","reference":{"screens":{"homework":[{"id":"header-9","type":"header","zone":"header","text":"My Homework","action":null,"link":null,"preset":"gradient","sh":"medium"},{"id":"card-10","type":"card","zone":"body","text":"Mathematics","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"},{"id":"card-11","type":"card","zone":"body","text":"Science","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"},{"id":"button-12","type":"button","zone":"footer","text":"Add Homework","action":"OPEN_FORM","link":null,"bg":"#0D8B7D","fg":"#FFFFFF","br":28},{"id":"card-17","type":"card","zone":"body","text":"Physics","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"}],"form":[{"id":"input-13","type":"input","zone":"body","text":"Homework title","action":null,"link":null},{"id":"button-14","type":"button","zone":"footer","text":"Save","action":"SAVE_HOMEWORK","link":"list","bg":"#0D8B7D","fg":"#FFFFFF","br":28}],"list":[{"id":"header-15","type":"header","zone":"header","text":"Homework List","action":null,"link":null,"preset":"gradient","sh":"medium"},{"id":"list-16","type":"list","zone":"body","text":"My saved items","action":null,"link":null,"collection":"homework"}]}}},"apps/school-app-1/modules/03-my-timetable.json":{"id":"m3","number":3,"title":"My Timetable","icon":"calendar","week":1,"summary":"Lay out your school week as a grid of lessons that students can add.","skills":["Data grids","Forms","Choices","Saving data","Linking screens"],"screens":[{"id":"timetable","name":"My Timetable"},{"id":"addlesson","name":"Add Lesson"}],"startScreen":"timetable","tools":["header","timetable","button","input","choice"],"listCollection":null,"subjectCards":false,"formScreen":null,"builtinHome":false,"steps":[{"id":"m3-s1","title":"Add the header","screen":"timetable","objective":"Start the My Timetable screen with a title bar.","concept":"A header sits at the top of a screen and tells people where they are.","expected":"A title bar appears at the top of the phone.","do":{"k":"drag","tool":"header","zone":"header","n":1},"expect":[{"type":"header","zone":"header","min":1,"label":"A Header sits in the Header zone of My Timetable","fail":"Drag the Header tool onto the glowing Header zone."}],"hints":["Find the glowing Header tool in the toolbox on the left.","Drag it onto the glowing Header zone of the phone.","On a touch screen: tap Header, then tap the glowing Header zone."]},{"id":"m3-s2","title":"Name your screen","screen":"timetable","objective":"Give the screen a clear title.","concept":"The header will say “My Timetable”. A clear title means nobody gets lost.","expected":"The header reads “My Timetable”.","do":{"k":"edit","type":"header","text":"My Timetable"},"expect":[{"type":"header","text":"My Timetable","label":"The header says exactly: My Timetable"}],"hints":["Click the header on the phone to select it.","Edit Text content in the Properties panel.","Type exactly: My Timetable"],"styles":[{"target":{"type":"header","text":"My Timetable"},"set":{"preset":"gradient"},"screen":"timetable"}]},{"id":"m3-s3","title":"Add the week grid","screen":"timetable","objective":"Place a timetable component on the screen.","concept":"The timetable shows the school week as a grid: days across the top and lesson periods down the side. It fills itself from saved lessons.","expected":"A week grid appears in the Body zone.","do":{"k":"drag","tool":"timetable","zone":"body","n":1},"expect":[{"type":"timetable","zone":"body","min":1,"label":"A Timetable sits in the Body zone of My Timetable","fail":"Drag the Timetable tool onto the glowing Body zone."}],"hints":["Find the glowing Timetable tool in the toolbox on the left.","Drag it onto the glowing Body zone of the phone.","On a touch screen: tap Timetable, then tap the glowing Body zone."]},{"id":"m3-s4","title":"Add the Add Lesson button","screen":"timetable","objective":"Place the Add Lesson button.","concept":"The button will open the form where new lessons are typed in.","expected":"A button appears in the Action bar.","do":{"k":"drag","tool":"button","zone":"footer","n":1},"expect":[{"type":"button","zone":"footer","min":1,"label":"A Button sits in the Action bar of My Timetable","fail":"Drag the Button tool onto the glowing Action bar."}],"hints":["Find the glowing Button tool in the toolbox on the left.","Drag it onto the glowing Action bar of the phone.","On a touch screen: tap Button, then tap the glowing Action bar."]},{"id":"m3-s5","title":"Label the button","screen":"timetable","objective":"Use a clear label.","concept":"The label says what will happen, and commands find the button by its label.","expected":"The button reads “Add Lesson”.","do":{"k":"edit","type":"button","text":"Add Lesson"},"expect":[{"type":"button","text":"Add Lesson","label":"The button says exactly: Add Lesson"}],"hints":["Click the button on the phone to select it.","Edit Text content in the Properties panel.","Type exactly: Add Lesson"],"styles":[{"target":{"type":"button","text":"Add Lesson"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF"},"screen":"timetable"}]},{"id":"m3-s6","title":"Open the next screen","screen":"timetable","objective":"Move to the second screen.","concept":"NAVIGATE TO moves your workspace to the Add Lesson screen so you can build it.","expected":"The phone shows the Add Lesson screen.","do":{"k":"cmd","cmds":["NAVIGATE TO \"Add Lesson\""],"allow":["NAVIGATE TO"],"free":false,"select":null},"expect":[{"t":"screen","is":"addlesson","label":"You are on the Add Lesson screen"}],"hints":["NAVIGATE TO changes the screen you are building.","Put the text inside straight quotation marks.","Copy the command from the step card exactly, then press Run Commands."]},{"id":"m3-s7","title":"Add the subject box","screen":"addlesson","objective":"Create a text box with a command.","concept":"ADD INPUT creates a text box. The text you give is its label and the name of the saved field.","expected":"A text box labelled Subject appears.","do":{"k":"cmd","cmds":["ADD INPUT \"Subject\""],"allow":["ADD INPUT"],"free":false,"select":null},"expect":[{"type":"input","text":"Subject","label":"A text box called Subject exists"}],"hints":["ADD INPUT creates a text box.","Put the text inside straight quotation marks.","Copy the command from the step card exactly, then press Run Commands."]},{"id":"m3-s8","title":"Add the day choice","screen":"addlesson","objective":"Offer a list of days to pick from.","concept":"A choice is a drop-down list. OPTIONS lists the answers, separated by commas.","expected":"A Day choice with five weekdays appears.","do":{"k":"cmd","cmds":["ADD CHOICE \"Day\" OPTIONS \"Sunday,Monday,Tuesday,Wednesday,Thursday\""],"allow":["ADD CHOICE"],"free":false,"select":null},"expect":[{"type":"choice","text":"Day","len":{"options":5},"label":"A choice called Day with 5 options exists"}],"hints":["ADD CHOICE needs a label and an OPTIONS list.","Separate the options with commas. Do not put extra quotation marks inside.","Copy the command from the step card exactly, then press Run Commands."]},{"id":"m3-s9","title":"Add the period choice","screen":"addlesson","objective":"Add a second drop-down.","concept":"Each lesson happens in a period of the school day. Six periods fit most timetables.","expected":"A Period choice with six options appears.","do":{"k":"cmd","cmds":["ADD CHOICE \"Period\" OPTIONS \"1,2,3,4,5,6\""],"allow":["ADD CHOICE"],"free":false,"select":null},"expect":[{"type":"choice","text":"Period","len":{"options":6},"label":"A choice called Period with 6 options exists"}],"hints":["Use ADD CHOICE again.","Put the text inside straight quotation marks.","Copy the command from the step card exactly, then press Run Commands."]},{"id":"m3-s10","title":"Add a Save button","screen":"addlesson","objective":"Create a button that stores the lesson.","concept":"SAVE \"lessons\" collects the boxes on this screen and keeps them in a collection called lessons. The timetable reads from that collection.","expected":"The Save Lesson button is ready to save.","do":{"k":"cmd","cmds":["ADD BUTTON \"Save Lesson\"","SET ACTION \"Save Lesson\" SAVE \"lessons\""],"allow":["ADD BUTTON","SET ACTION"],"free":false,"select":null},"expect":[{"type":"button","text":"Save Lesson","action":"SAVE:lessons","label":"Save Lesson is set to SAVE lessons"}],"hints":["Add the button first, then give it an action.","Put the text inside straight quotation marks.","Copy the command from the step card exactly, then press Run Commands."],"styles":[{"target":{"type":"button","text":"Save Lesson"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF"},"screen":"addlesson"}]},{"id":"m3-s11","title":"Connect the screens","screen":"addlesson","objective":"Make both buttons take people to the right screen.","concept":"A link sends the user to another screen after the button’s action. You need one link in each direction.","expected":"Both buttons now open the other screen.","do":{"k":"cmd","cmds":["LINK BUTTON \"Save Lesson\" TO \"My Timetable\"","NAVIGATE TO \"My Timetable\"","LINK BUTTON \"Add Lesson\" TO \"Add Lesson\""],"allow":["LINK BUTTON","NAVIGATE TO"],"free ","label":"Style the screen","step":"d5-style"},{"id":"e","type":"subprocess","label":"Run Project and view your slip","step":"d5-s6"},{"id":"db","type":"data","label":"Read the newest request from \"dismissals\""},{"id":"q","type":"decision","label":"Is there a request to show?"},{"id":"n","type":"display","label":"Message: Fill in the form first","rowWith":"q"},{"id":"l","type":"document","label":"Gate slip: reference, student, date, time, reason, Pending approval"},{"id":"end","type":"end","label":"Module 5 complete: take the quiz and publish your app"}],"edges":[{"from":"start","to":"a"},{"from":"a","to":"b"},{"from":"b","to":"c"},{"from":"c","to":"d"},{"from":"d","to":"e"},{"from":"e","to":"db"},{"from":"db","to":"q"},{"from":"q","to":"l","label":"Yes"},{"from":"q","to":"n","label":"No"},{"from":"l","to":"end"},{"from":"n","to":"end","route":"loop","side":"right"}]},"apps/student-dismissal-app/modules/01-welcome.json":{"id":"d1","number":1,"title":"Welcome Screen","icon":"star","week":1,"summary":"Design the first screen of your app: your school’s name, a logo, a welcome message, cards and buttons.","skills":["Components","Drag and drop","Properties","Colours","Commands","Navigation","Testing"],"screens":[{"id":"welcome","name":"Welcome"},{"id":"home","name":"Home","builtin":true}],"startScreen":"welcome","tools":["header","logo","text","card","button"],"builtinHome":true,"listCollection":null,"subjectCards":false,"formScreen":null,"steps":[{"id":"d1-s1","title":"Add the school header","screen":"welcome","objective":"Start your welcome screen with a title bar.","concept":"The welcome screen is the first thing students see. A header at the top will carry your school’s name.","expected":"A title bar appears at the top of the phone.","do":{"k":"drag","tool":"header","zone":"header","n":1},"expect":[{"type":"header","zone":"header","min":1,"label":"A Header sits in the Header zone of the Welcome screen","fail":"Drag the Header tool onto the glowing Header zone."}],"hints":["Find the glowing Header tool in the toolbox on the left.","Drag it onto the dashed strip at the top of the phone.","On a touch screen: tap Header, then tap the glowing Header zone."]},{"id":"d1-s2","title":"Type your school’s name","screen":"welcome","objective":"Make the app yours by using your real school name.","concept":"The header text becomes the title of your welcome screen. Everyone who opens the app will see it first.","expected":"The header shows your school’s name.","do":{"k":"edit","type":"header","text":"Alrowad International Schools"},"expect":[{"type":"header","text":"Alrowad International Schools","label":"The header says exactly: Alrowad International Schools","fail":"Select the header on the phone, then in Properties → Text content type exactly: Alrowad International Schools"}],"hints":["Click the header on the phone to select it.","In the Properties panel, change Text content.","Type your school’s name, then press Check My Work."],"styles":[{"target":{"type":"header","text":"Alrowad International Schools"},"set":{"preset":"gradient"},"screen":"welcome"}]},{"id":"d1-s3","title":"Add your school logo","screen":"welcome","objective":"Place a logo badge on the screen.","concept":"A logo is a round badge that shows your school’s initials. It makes the app feel like it belongs to your school.","expected":"A round badge appears in the middle of the phone.","do":{"k":"drag","tool":"logo","zone":"body","n":1},"expect":[{"type":"logo","min":1,"label":"A Logo sits in the Body zone","fail":"Drag the Logo tool into the Body zone."}],"hints":["The Logo tool is in the toolbox, with a pink badge icon.","Drop it in the large Body zone.","Tap-to-place works too: tap Logo, then tap the Body zone."]},{"id":"d1-s4","title":"Put your school name on the logo","screen":"welcome","objective":"Learn that the logo takes its initials from the name you type.","concept":"The logo shows the first letters of the words you type. “Al Rowad School” becomes AR.","expected":"The logo shows your school’s initials and name.","do":{"k":"edit","type":"logo","text":"Alrowad International Schools"},"expect":[{"type":"logo","text":"Alrowad International Schools","label":"The logo says exactly: Alrowad International Schools","fail":"Select the logo on the phone, then in Properties → Text content type exactly: Alrowad International Schools"}],"hints":["Click the logo on the phone.","Edit Text content in the Properties panel.","Type your school’s name. The initials update by themselves."],"styles":[{"target":{"type":"logo","text":"Alrowad International Schools"},"set":{"bg":"#17263D"},"screen":"welcome"}]},{"id":"d1-s5","title":"Write a welcome message","screen":"welcome","objective":"Add a line of text with a command.","concept":"ADD TEXT puts a line of text in the Body zone. Write a friendly message in your own words, inside quotation marks.","expected":"Your message appears under the logo.","do":{"k":"cmd","cmds":["ADD TEXT \"Welcome to our dismissal app!\""],"allow":["ADD TEXT"],"free":false,"select":null},"expect":[{"type":"text","text":"Welcome to our dismissal app!","label":"The message is exactly: Welcome to our dismissal app!"}],"hints":["ADD TEXT adds a line of text.","Put your message inside quotation marks.","For example: ADD TEXT \"Welcome to our dismissal app!\""],"styles":[{"target":{"type":"text","text":"Welcome to our dismissal app!"},"set":{"fg":"#064F47"},"screen":"welcome"}]},{"id":"d1-s6","title":"Add your first card","screen":"welcome","objective":"Use a card to show one feature of your app.","concept":"Cards are blocks that hold one idea each, such as Request, Timetable or Quiz.","expected":"A card appears in the Body zone.","do":{"k":"drag","tool":"card","zone":"body","n":1},"expect":[{"type":"card","min":1,"label":"A Card sits in the Body zone","fail":"Drag the Card tool into the Body zone."}],"hints":["Find the Card tool.","Drop it in the Body zone.","Tap-to-place: tap Card, then tap the Body zone."]},{"id":"d1-s7","title":"Name your card","screen":"welcome","objective":"Give the card a name with SET TEXT.","concept":"SET TEXT changes the text of the selected component. Choose a feature of your app, such as Request Dismissal.","expected":"The card shows your own name for it.","do":{"k":"cmd","cmds":["SET TEXT \"Request Dismissal\""],"allow":["SET TEXT"],"free":false,"select":"card"},"expect":[{"type":"card","text":"Request Dismissal","label":"The card says exactly: Request Dismissal"}],"hints":["Click the card on the phone first.","Then type SET TEXT and the name in quotation marks.","For example: SET TEXT \"Request Dismissal\""],"styles":[{"target":{"type":"card","text":"Request Dismissal"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"}]},{"id":"d1-s8","title":"Add two more cards","screen":"welcome","objective":"Show three different features with three different cards.","concept":"Each ADD CARD command creates another card. Pick names that tell students what the app can do.","expected":"Three cards, each with its own name.","do":{"k":"cmd","cmds":["ADD CARD \"Student Details\"","ADD CARD \"My Requests\""],"allow":["ADD CARD"],"free":false,"select":null},"expect":[{"type":"card","min":3,"label":"There are 3 cards: Request Dismissal, Student Details, My Requests"},{"type":"card","text":"Request Dismissal","label":"A card says exactly: Request Dismissal"},{"type":"card","text":"Student Details","label":"A card says exactly: Student Details"},{"type":"card","text":"My Requests","label":"A card says exactly: My Requests"}],"hints":["Type two ADD CARD commands, one per line.","Each name goes in quotation marks.","For example: ADD CARD \"Student Details\" and ADD CARD \"My Requests\""],"styles":[{"target":{"type":"card","text":"Student Details"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"},{"target":{"type":"card","text":"My Requests"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"}]},{"id":"d1-s9","title":"Add the Get Started button","screen":"welcome","objective":"Place a button in the Action bar.","concept":"The Get Started button will take students from the welcome screen into the app.","expected":"A button appears at the bottom of the phone.","do":{"k":"drag","tool":"button","zone":"footer","n":1},"expect":[{"type":"button","zone":"footer","min":1,"label":"A Button sits in the Action bar","fail":"Drag the Button tool to the Action bar at the bottom."}],"hints":["Find the Button tool.","Drop it on the Action bar strip at the bottom.","Tap-to-place: tap Button, then tap the Action bar."]},{"id":"d1-s10","title":"Label the button","screen":"welcome","objective":"Give the button a clear label.","concept":"We will use the exact label Get Started, because the next steps find the button by its label.","expected":"The button reads “Get Started”.","do":{"k":"edit","type":"button","text":"Get Started"},"expect":[{"type":"button","text":"Get Started","label":"The button says Get Started","fail":"Select the button and set Text content to exactly: Get Started"}],"hints":["Click the button on the phone.","Change Text content in the Properties panel.","Type exactly: Get Started"],"styles":[{"target":{"type":"button","text":"Get Started"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF"},"screen":"welcome"}]},{"id":"d1-s11","title":"Add a second button","screen":"welcome","objective":"Use another button for a different job.","concept":"A welcome screen can offer more than one choice, such as About Us or Contact. Choose a label that fits your school.","expected":"A second button appears in the Action bar.","do":{"k":"cmd","cmds":["ADD BUTTON \"About Us\""],"allow":["ADD BUTTON"],"free":false,"select":null},"expect":[{"type":"button","min":2,"label":"There are two buttons"},{"type":"button","text":"About Us","label":"The second button says exactly: About Us"}],"hints":["ADD BUTTON adds a button to the Action bar.","The label goes in quotation marks.","For example: ADD BUTTON \"About Us\""],"styles":[{"target":{"type":"button","text":"About Us"},"set":{"preset":"outline"},"screen":"welcome"}]},{"id":"d1-s12","title":"Link Get Started to Home","screen":"welcome","objective":"Make the button open another screen.","concept":"LINK BUTTON sends the user to a screen when they tap. The Home screen is the dashboard of your finished app, which the studio builds for you.","expected":"Get Started now opens Home.","do":{"k":"cmd","cmds":["LINK BUTTON \"Get Started\" TO \"Home\""],"allow":["LINK BUTTON"],"free":false,"select":null},"expect":[{"type":"button","text":"Get Started","link":"home","label":"Get Started is linked to Home","fail":"Run: LINK BUTTON \"Get Started\" TO \"Home\""}],"hints":["LINK BUTTON needs the button label and the screen name.","Both go in quotation marks, with the word TO between.","Exactly: LINK BUTTON \"Get Started\" TO \"Home\""]},{"id":"d1-style","title":"Final style check: every colour, border, shadow and style","screen":"welcome","objective":"Give your screens the same colours, shapes and shadows as the model app.","concept":"Colours were chosen while you built each element. Now finish the whole look: every colour, background, border, corner, shadow and text style below must match the model app you tried at the start. Items you already set show a tick.","expected":"Your screens look exactly like the model app.","hints":["Click the element on the phone first. The style box (Choose colours, borders and corners) opens by itself.","Follow the sub-steps one by one: each says which row to use and which option to click. The red dot shows where.","Text alignment and weight are in the Properties panel (right) under “Text and layout”."],"do":{"k":"style","acts":[{"target":{"type":"header","text":"Alrowad International Schools"},"set":{"preset":"gradient","sh":"medium"},"screen":"welcome"},{"target":{"type":"logo","text":"Alrowad International Schools"},"set":{"bg":"#17263D"},"screen":"welcome"},{"target":{"type":"text","text":"Welcome to our dismissal app!"},"set":{"fg":"#064F47","al":"center","fw":"bold"},"screen":"welcome"},{"target":{"type":"card","text":"Request Dismissal"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"},{"target":{"type":"card","text":"Student Details"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"},{"target":{"type":"card","text":"My Requests"},"set":{"bg":"#DDF7F3","fg":"#064F47"},"screen":"welcome"},{"target":{"type":"button","text":"Get Started"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF","br":28},"screen":"welcome"},{"target":{"type":"button","text":"About Us"},"set":{"preset":"outline","br":28},"screen":"welcome"}]},"expect":[]},{"id":"d1-s14","title":"Run and test your welcome screen","screen":"welcome","objective":"Use your screen like a student would.","concept":"Run Project turns the phone into a working app. The studio first shows a short demo of your buttons, then you can tap them yourself.","expected":"Tapping Get Started opens the Home dashboard.","do":{"k":"custom","allow":[]},"expect":[{"t":"flag","name":"ran","fail":"Press Run Project in the top bar.","label":"You pressed Run Project"},{"t":"flag","name":"nav:home","label":"You tapped Get Started and saw the Home screen","fail":"In the running app, tap Get Started yourself. If nothing happens, check the link you made in step 12."}],"subs":[{"t":"Press Run Project in the top bar","hot":["topRun"],"done":{"any":[{"run":true},{"flag":"nav:home"}]}},{"t":"Watch the demo, then tap Get Started yourself","hot":["runBtn:Get Started"],"done":{"flag":"nav:home"}}],"hints":["Press Run Project and watch the demo.","Tap the Get Started button on the phone.","The Home dashboard should appear."]}],"objectives":["Design the welcome screen for the dismissal app: school name, logo and a friendly message.","Use cards and buttons, and link a button to the Home screen.","Choose your own colours, then run the screen like a real student."],"mcqs":[{"q":"Why does an app usually open with a welcome screen?","a":["It shows whose app it is and gives a clear first action","It makes the phone run faster","It stores the user's password","It is required by every phone"],"why":"A welcome screen sets the tone and points the user to what to do next."},{"q":"Which component is the right choice for the title bar at the top of a screen?","a":["Header","Card","Logo","Calendar"],"why":"A header tells people where they are on every screen."},{"q":"What happens when a button is linked to another screen?","a":["Tapping the button takes the user to that screen","The button is deleted","The screen turns off","The button changes colour only"],"why":"A link is the connection that makes an app move from one screen to the next."},{"q":"Why should every screen of an app share the same colours and style?","a":["It looks professional and is easier to learn","It makes the code shorter","It saves battery","It stops the app from crashing"],"why":"Consistency helps users recognise buttons and trust the app."},{"q":"Why do you run and test the app after building a screen?","a":["To find mistakes the way a real user would meet them","To delete the screen","To make the phone update","Because the studio asks for a password"],"why":"Testing proves the screen really works, not just that it looks right."}],"flowchart":"flowcharts/d1.json","reference":{"screens":{"welcome":[{"id":"header-1","type":"header","zone":"header","text":"Alrowad International Schools","action":null,"link":null,"preset":"gradient","sh":"medium"},{"id":"logo-2","type":"logo","zone":"body","text":"Alrowad International Schools","action":null,"link":null,"bg":"#17263D"},{"id":"text-3","type":"text","zone":"body","text":"Welcome to our dismissal app!","action":null,"link":null,"fg":"#064F47","al":"center","fw":"bold"},{"id":"card-4","type":"card","zone":"body","text":"Request Dismissal","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"},{"id":"card-5","type":"card","zone":"body","text":"Student Details","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"},{"id":"card-6","type":"card","zone":"body","text":"My Requests","action":null,"link":null,"bg":"#DDF7F3","fg":"#064F47"},{"id":"button-7","type":"button","zone":"footer","text":"Get Started","action":null,"link":"home","bg":"#0D8B7D","fg":"#FFFFFF","br":28},{"id":"button-8","type":"button","zone":"footer","text":"About Us","action":null,"link":null,"preset":"outline","br":28}],"home":[]}}},"apps/student-dismissal-app/modules/02-student-details.json":{"id":"d2","number":2,"title":"Student Details","icon":"user","week":1,"summary":"Build the form where a student enters their SID, name and grade, and see the saved details.","skills":["Forms","Choices","Saving records","Showing saved data"],"screens":[{"id":"details","name":"Student Details"},{"id":"profile","name":"My Profile"}],"startScreen":"details","tools":["header","text","input","choice","button","latest"],"listCollection":"students","subjectCards":false,"formScreen":null,"builtinHome":false,"steps":[{"id":"d2-s1","title":"Add the header","screen":"details","objective":"Start the Student Details screen with a title bar.","concept":"A header sits at the top of a screen and tells people where they are.","expected":"A title bar appears at the top of the phone.","do":{"k":"drag","tool":"header","zone":"header","n":1},"expect":[{"type":"header","zone":"header","min":1,"label":"A Header sits in the Header zone of Student Details","fail":"Drag the Header tool onto the glowing Header zone."}],"hints":["Find the glowing Header tool in the toolbox on the left.","Drag it onto the glowing Header zone of the phone.","On a touch screen: tap Header, then tap the glowing Header zone."]},{"id":"d2-s2","title":"Name your screen","screen":"details","objective":"Give the screen a clear title.","concept":"The header will say “Student Details”. A clear title means nobody gets lost.","expected":"The header reads “Student Details”.","do":{"k":"edit","type":"header","text":"Student Details"},"expect":[{"type":"header","text":"Student Details","label":"The header says exactly: Student Details"}],"hints":["Click the header on the phone to select it.","Edit Text content in the Properties panel.","Type exactly: Student Details"],"styles":[{"target":{"type":"header","text":"Student Details"},"set":{"preset":"gradient"},"screen":"details"}]},{"id":"d2-s3","title":"Add the SID box","screen":"details","objective":"Create a box for the student ID.","concept":"Every student has an ID number (SID). The label you type tells the student what to enter and names the saved field.","expected":"A text box labelled Student ID (SID) appears.","do":{"k":"cmd","cmds":["ADD INPUT \"Student ID (SID)\""],"allow":["ADD INPUT"],"free":false,"select":null},"expect":[{"type":"input","text":"Student ID (SID)","label":"A text box called Student ID (SID) exists"}],"hints":["ADD INPUT creates a text box.","Put the text inside straight quotation marks.","Copy the command from the step card exactly, then press Run Commands."]},{"id":"d2-s4","title":"Add the name box","screen":"details","objective":"Create a box for the student’s name.","concept":"The studio uses the box labelled “name” as the title of each saved record.","expected":"A text box labelled Student name appears.","do":{"k":"cmd","cmds":["ADD INPUT \"Student name\""],"allow":["ADD INPUT"],"free":false,"select":null},"expect":[{"type":"input","text":"Student name","label":"A text box called Student name exists"}],"hints":["ADD INPUT again, with the label Student name.","Put the text inside straight quotation marks.","Copy the command from the step card exactly, then press Run Commands."]},{"id":"d2-s5","title":"Add the grade list","screen":"details","objective":"Let the student pick a grade.","concept":"A drop-down prevents typing mistakes such as “Grade 7B” or “seven”. OPTIONS lists the grades, separated by commas.","expected":"A Grade drop-down with 12 options appears.","do":{"k":"cmd","cmds":["ADD CHOICE \"Grade\" OPTIONS \"Grade 1,Grade 2,Grade 3,Grade 4,Grade 5,Grade 6,Grade 7,Grade 8,Grade 9,Grade 10,Grade 11,Grade 12\""],"allow":["ADD CHOICE"],"free":false,"select":null},"expect":[{"type":"choice","text":"Grade","len":{"options":12},"label":"A Grade choice with 12 options exists"}],"hints":["ADD CHOICE needs a label and an OPTIONS list.","Separate the grades with commas inside one pair of quotation marks.","Copy the command from the step card exactly, then press Run Commands."]},{"id":"d2-s6","title":"Add a Save button","screen":"details","objective":"Create a button that stores the details.","concept":"SAVE \"students\" keeps the form in a collection called students. The dismissal request module will use these details later.","expected":"The Save Details button is ready.","do":{"k":"cmd","cmds":["ADD BUTTON \"Save Details\"","SET ACTION \"Save Details\" SAVE \"students\""],"allow":["ADD BUTTON","SET ACTION"],"free":false,"select":null},"expect":[{"type":"button","text":"Save Details","action":"SAVE:students","label":"Save Details is set to SAVE students"}],"hints":["Add the button first, then give it an action.","Put the text inside straight quotation marks.","Copy the command from the step card exactly, then press Run Commands."],"styles":[{"target":{"type":"button","text":"Save Details"},"set":{"bg":"#0D8B7D","fg":"#FFFFFF"},"screen":"details"}]},{"id":"d2-s7","title":"Open the next screen","screen":"details","objective":"Move to the second screen.","concept":"NAVIGATE TO moves your workspace to the My Profile screen so you can build it.","expected":"The phone shows the My Profile screen.","do":{"k":"cmd","cmds":["NAVIGATE TO \"My Profile\""],"allow":["NAVIGATE TO"],"free":false,"select":null},"expect":[{"t":"screen","is":"profile","label":"You are on the My Profile screen"}],"hints":["NAVIGATE TO changes the screen you are building.","Put the text inside straight quotation marks.","Copy the command from the step card exactly, then press Run Commands."]},{"id":"d2-s8","title":"Title the profile screen","screen":"profile","objective":"Add a header with a comm
